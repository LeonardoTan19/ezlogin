name: build-multi-platform

on:
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"
  NDK_VERSION: "27.0.12077973"
  JAVA_VERSION: "21"

permissions:
  contents: write

jobs:
  build-cli-ubuntu:
    name: cli-ubuntu-amd64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-cli-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-cli-${{ runner.os }}-

      - name: Build CLI
        run: |
          chmod +x scripts/build-cli-ubuntu.sh
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-cli-ubuntu.sh "$VERSION"

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ezlogin-cli-ubuntu-amd64
          path: dist-cli/*.deb
          if-no-files-found: error

  build-desktop:
    name: desktop-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ezlogin ${{ github.ref_name }}"
          releaseBody: "See the assets below to install this version."
          releaseDraft: false
          prerelease: false

  build-android:
    name: android-aarch64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/aarch64-linux-android/release
          key: cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-android-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_DIR="$RUNNER_TEMP/android-signing"
          KEYSTORE_PATH="$KEYSTORE_DIR/release.jks"
          mkdir -p "$KEYSTORE_DIR"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cd src-tauri/gen/android
          printf 'keyAlias=%s\nkeyPassword=%s\nstorePassword=%s\nstoreFile=%s\n' \
            "${{ secrets.ANDROID_KEY_ALIAS }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "$KEYSTORE_PATH" > keystore.properties
          echo "TAURI_ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Configure Android NDK toolchain
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "PATH=$NDK_BIN:$PATH"
            echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$NDK_BIN/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android24-clang"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=$NDK_BIN/llvm-ar"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
          } >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        env:
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm tauri android build --apk --target aarch64

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | grep '/release/' | head -n 1 || true)"
          [ -z "$APK" ] && APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1 || true)"
          [ -z "$APK" ] && { echo "No APK found." >&2; exit 1; }
          mkdir -p dist-android
          cp "$APK" "dist-android/ezlogin-android-v${VERSION}-aarch64.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-aarch64
          path: dist-android/*.apk
          if-no-files-found: error

  publish-release:
    name: publish-github-release
    needs: [build-cli-ubuntu, build-desktop, build-android]
    runs-on: ubuntu-24.04

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Upload CLI and Android to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            release-artifacts/**/*.deb
            release-artifacts/**/*.apk
